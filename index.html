<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTC Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- Header Banner Block with Gradient Accent -->
    <div class="header-banner">
      <h1>ಪ್ರಭಾರ ವರ್ಗಾವಣೆ ಪ್ರಮಾಣ ಪತ್ರ</h1>
      <div class="subtitle"> (ಖಾಲಿ ಜಾಗಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ)</div>
    </div>

    <form id="ctcForm" onsubmit="handleFormSubmit(event)">
      <div class="form-grid">
        
        <!-- Time Assignment -->
        <div class="form-group span-2">
          <label>ಪ್ರಭಾರ ವಹಿಸಿಕೊಂಡ ಸಮಯ</label>
          <div class="segmented-control">
            <label class="active" onclick="toggleSegment(this)">
              <input type="radio" name="time_period" value="forenoon" checked>
              <span>🌅 ಪೂರ್ವಾಹ್ನ</span>
            </label>
            <label onclick="toggleSegment(this)">
              <input type="radio" name="time_period" value="afternoon">
              <span>🌇 ಅಪರಾಹ್ನ</span>
            </label>
          </div>
        </div>

        <!-- Date Assignment -->
        <div class="form-group">
          <label for="assignment-date">ಪ್ರಭಾರ ವಹಿಸಿಕೊಂಡ ದಿನಾಂಕ</label>
          <input type="date" id="assignment-date" name="assignment_date" required>
        </div>

        <!-- Government Order -->
        <div class="form-group">
          <label for="gov-order">ಸರ್ಕಾರಿ ಆದೇಶ</label>
          <input type="text" id="gov-order" name="gov_order" placeholder="ಉದಾ: ಇಒ 123 ಬಿಸಿಎ" required>
        </div>

        <!-- Government Order Date -->
        <div class="form-group">
          <label for="order-date">ಸರ್ಕಾರಿ ಆದೇಶದ ದಿನಾಂಕ</label>
          <input type="date" id="order-date" name="order_date" required>
        </div>

        <!-- Reason Selection -->
        <div class="form-group">
          <label for="reason">ಕಾರಣ</label>
          <div class="select-wrapper">
            <select id="reason" name="reason" required>
              <option value="" disabled selected hidden>ಆಯ್ಕೆ ಮಾಡಿ</option>
              <option value="leave">ರಜೆ</option>
              <option value="transfer">ವರ್ಗಾವಣೆ</option>
              <option value="promotion">ಮುಂಬಡ್ತಿ</option>
            </select>
          </div>
        </div>

        <!-- Designation -->
        <div class="form-group">
          <label for="designation">ಪ್ರಭಾರ ವಹಿಸಿಕೊಂಡ ಹುದ್ದೆ</label>
          <input type="text" id="designation" name="designation" placeholder="ಹುದ್ದೆಯ ಹೆಸರು" required>
        </div>

        <!-- Place -->
        <div class="form-group">
          <label for="place"> ಸಂಸ್ಥೆಯ ಹೆಸರು ಮತ್ತು ಸ್ಥಳ</label>
          <input type="text" id="place" name="place" placeholder="ಉದಾ: ಪಶುಚಿಕಿತ್ಸಾಲಯ, ಹೊರಳಹಳ್ಳಿ" required>
        </div>

        <!-- Relieved Officer Name -->
        <div class="form-group">
          <label for="relieved-officer">ಪದಮುಕ್ತ ಅಧಿಕಾರಿಯ ಹೆಸರು</label>
          <input type="text" id="relieved-officer" name="relieved_officer" placeholder="ಹೆಸರು ನಮೂದಿಸಿ" required>
        </div>

        <!-- Relieving Officer Name -->
        <div class="form-group">
          <label for="relieving-officer">ಪದಗ್ರಾಹಿ ಅಧಿಕಾರಿಯ ಹೆಸರು</label>
          <input type="text" id="relieving-officer" name="relieving_officer" placeholder="ಹೆಸರು ನಮೂದಿಸಿ" required>
        </div>

        <!-- Submit Button -->
        <div class="form-group span-2">
          <button type="submit" id="generateButton">
            <span>Generate CTC</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>

      </div>
    </form>

    <!-- Async UI Component Placeholders -->
    <div id="waitingState" class="waiting hidden">
      <div class="spinner"></div>
      <div class="pleaseWait">Please wait… Preparing your CTC PDF</div>
    </div>

    <div id="successState" class="success hidden">
      <div class="success-icon">✓</div>
      <div>CTC PDF is ready to download!</div>
      <button class="download" onclick="handleDownload()">Download CTC PDF</button>
    </div>

    <div id="errorState" class="error hidden">
      ಒಂದು ದೋಷ ಸಂಭವಿಸಿದೆ. ದಯವಿಟ್ಟು ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ.
    </div>

  </div>

  <script>
    // Handles the segmented radio button visual toggle animation
    function toggleSegment(element) {
      const labels = element.parentElement.querySelectorAll('label');
      labels.forEach(lbl => lbl.classList.remove('active'));
      element.classList.add('active');
      
      const input = element.querySelector('input');
      if(input) input.checked = true;
    }

    // Handles the modern simulated form state progression
    function handleFormSubmit(event) {
      event.preventDefault();

      const btn = document.getElementById('generateButton');
      const waiting = document.getElementById('waitingState');
      const success = document.getElementById('successState');
      const error = document.getElementById('errorState');

      // Reset and hide states
      success.classList.add('hidden');
      error.classList.add('hidden');

      // Enable loading state animations
      btn.disabled = true;
      waiting.classList.remove('hidden');

      // Simulate an async document compilation
      setTimeout(() => {
        waiting.classList.add('hidden');
        success.classList.remove('hidden');
        btn.disabled = false;
      }, 2500);
    }

    // Handles the simulation action for downloading files
    function handleDownload() {
      alert("Starting your CTC file download sequence...");
    }
  </script>
</body>
</html>
